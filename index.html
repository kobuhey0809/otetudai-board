<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8e9"><title>おてつだいボード</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#4b4036;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.hero{background:#fff0bd;border:2px solid #f5d68b;border-radius:24px;padding:20px 12px;text-align:center}.hero .flowers{font-size:36px}.hero h1{font-size:clamp(25px,7vw,32px);margin:4px 0;font-weight:900}.hero p{margin:4px 0;font-weight:750}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:white;border:2px solid #f2dfc7;border-radius:20px;padding:13px 5px;text-align:center}.label{font-size:14px;font-weight:800}.num{font-size:clamp(25px,7vw,32px);line-height:1.5;color:#e47a42;font-weight:900}.date{text-align:center;color:#897b6b;font-size:13px}.section{font-size:20px;font-weight:900;margin:20px 0 10px}.jobs{display:grid;grid-template-columns:1fr 1fr;gap:11px}.job{min-height:120px;border:2px solid #ead8c5;border-radius:20px;background:#fff;color:#4b4036;padding:12px 4px;font-size:16px;font-weight:850;box-shadow:0 3px 0 #ead8c5;cursor:pointer;touch-action:manipulation}.job:active{transform:translateY(2px);box-shadow:none}.emoji{display:block;font-size:31px;margin-bottom:5px}.price{display:block;color:#d96b38;font-size:20px;margin-top:5px}.undo{width:100%;border:2px solid #b9d8ce;border-radius:16px;background:#e6f5ed;color:#245b4b;padding:14px;font-size:16px;font-weight:850;cursor:pointer}.undo:disabled{opacity:.45;cursor:not-allowed}.notice{text-align:center;font-weight:800;min-height:27px;color:#32745d;margin:10px 0 0;font-size:14px}.log{background:white;border-radius:18px;padding:12px;border:2px solid #f2dfc7}.entry{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px dashed #ead8c5;font-size:14px}.entry:last-child{border-bottom:0}.entry strong{color:#d96b38}.empty{text-align:center;padding:18px 5px;color:#897b6b;font-size:14px}.foot{text-align:center;font-size:12px;color:#897b6b;margin:16px 0 8px}.reset{display:block;margin:12px auto 0;background:none;border:0;color:#897b6b;text-decoration:underline;font-size:12px;padding:8px}
</style></head><body><main class="wrap"><header class="hero"><div class="flowers">🌷 🐻 🌷</div><h1>おてつだいボード</h1><p>おてつだいで おかねをためよう！</p></header>
<section class="stats"><div class="stat"><div class="label">☀️ きょう ためたおかね</div><div class="num" id="day-total">0円</div></div><div class="stat"><div class="label">🐷 こんげつの ごうけい</div><div class="num" id="month-total">0円</div></div></section><div class="date" id="date-label"></div>
<h2 class="section">🌟 できたら おしてね！</h2><section class="jobs"><button class="job" data-job="せんたくものたたみ" data-price="10"><span class="emoji">👕</span>せんたくもの<br>たたみ<span class="price">＋10円</span></button><button class="job" data-job="つくえのかたづけ" data-price="10"><span class="emoji">🧸</span>つくえの<br>かたづけ<span class="price">＋10円</span></button><button class="job" data-job="おふろそうじ" data-price="10"><span class="emoji">🛁</span>おふろそうじ<span class="price">＋10円</span></button><button class="job" data-job="しょっきをはこぶ" data-price="10"><span class="emoji">🍽️</span>しょっきを<br>はこぶ<span class="price">＋10円</span></button><button class="job" data-job="くつをしまう" data-price="5"><span class="emoji">👟</span>くつをしまう<span class="price">＋5円</span></button><button class="job" data-job="せんたくものをしまう" data-price="5"><span class="emoji">🧺</span>せんたくものを<br>しまう<span class="price">＋5円</span></button></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div><button id="undo" class="undo" disabled>↩️ まちがえた！ 1かいもどす</button><h2 class="section">📖 きょうのおてつだいきろく</h2><section class="log" id="day-log" aria-live="polite"><div class="empty">これから がんばろう！ 🌼</div></section><div class="foot">おてつだい ありがとう！ 💛</div><button id="reset" class="reset">きろくを ぜんぶけす（おとな用）</button></main>
<script>
(()=>{const key='kids-chore-board-v1',names={'せんたくものたたみ':'👕 せんたくものたたみ','つくえのかたづけ':'🧸 つくえのかたづけ','おふろそうじ':'🛁 おふろそうじ','しょっきをはこぶ':'🍽️ しょっきをはこぶ','くつをしまう':'👟 くつをしまう','せんたくものをしまう':'🧺 せんたくものをしまう'};const now=()=>{const d=new Date();return{day:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),month:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}};let state={entries:[],undoId:null};try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s&&Array.isArray(s.entries))state=s}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){document.getElementById('notice').textContent='きろくを ほぞんできないみたい。おとなに しらせてね。'}}function render(){const n=now(),today=state.entries.filter(e=>e.day===n.day),monthly=state.entries.filter(e=>e.month===n.month);document.getElementById('day-total').textContent=today.reduce((s,e)=>s+(e.amount||10),0)+'円';document.getElementById('month-total').textContent=monthly.reduce((s,e)=>s+(e.amount||10),0)+'円';const d=new Date();document.getElementById('date-label').textContent=d.getFullYear()+'ねん '+(d.getMonth()+1)+'がつ '+d.getDate()+'にち';const log=document.getElementById('day-log');log.replaceChildren();if(!today.length){const el=document.createElement('div');el.className='empty';el.textContent='これから がんばろう！ 🌼';log.appendChild(el)}else today.slice().reverse().forEach(e=>{const row=document.createElement('div');row.className='entry';const name=document.createElement('span');name.textContent=names[e.job]||e.job;const price=document.createElement('strong');price.textContent='+'+(e.amount||10)+'円';row.append(name,price);log.appendChild(row)});document.getElementById('undo').disabled=!state.undoId||!state.entries.some(e=>e.id===state.undoId)}document.querySelectorAll('.job').forEach(b=>b.addEventListener('click',()=>{const n=now(),amount=Number(b.dataset.price||10),e={id:Date.now().toString()+'-'+Math.random().toString(36).slice(2),job:b.dataset.job,amount:amount,day:n.day,month:n.month};state.entries.push(e);state.undoId=e.id;save();render();document.getElementById('notice').textContent='やったね！ ＋'+amount+'円 🌟'}));document.getElementById('undo').addEventListener('click',()=>{if(!state.undoId)return;const i=state.entries.findIndex(e=>e.id===state.undoId);if(i<0)return;state.entries.splice(i,1);state.undoId=null;save();render();document.getElementById('notice').textContent='ひとつ もどしたよ 🌱'});document.getElementById('reset').addEventListener('click',()=>{if(confirm('ほんとうに きろくを ぜんぶけす？')){state={entries:[],undoId:null};save();render();document.getElementById('notice').textContent='きろくを けしたよ。'}});render()})();
</script></body></html>
